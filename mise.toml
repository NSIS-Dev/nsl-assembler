[tools]
hk = "1.53.0"
java = "temurin-17"
pkl = "latest"

[env]
HK_MISE = 1

[hooks]
postinstall = "hk install --mise"

[tasks.build]
description = "Build the JAR"
run = "./gradlew build"

[tasks.checks]
description = "Run all checks (formatting, tests, e2e corpus)"
depends = ["lint", "test:unit", "test:e2e"]

[tasks."test:e2e"]
description = "Assemble the e2e corpus and compile it with makensis"
run = "./e2e/run.sh"

[tasks.format]
description = "Format Java code with Spotless"
run = "./gradlew spotlessApply --no-daemon -q"

[tasks.lint]
description = "Check Java formatting with Spotless"
run = "./gradlew spotlessCheck --no-daemon -q"

[tasks."test:unit"]
description = "Run all tests"
run = "./gradlew test"
